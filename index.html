<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AetherTable" />
  <title>AetherTable MTG</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0b0d12;
      --panel: #141821;
      --panel-2: #1c2230;
      --border: #2a3346;
      --accent: #f59e0b;
      --accent-2: #3b82f6;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --danger: #ef4444;
      --ok: #10b981;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100dvh;
      overflow: hidden; position: fixed; overscroll-behavior: none;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    input, select, textarea { user-select: text; font-size: 16px !important; }
    button { cursor: pointer; font-family: inherit; border: none; border-radius: 10px; font-weight: 600; transition: transform 0.08s, opacity 0.15s; }
    button:active { transform: scale(0.97); }
    .hidden { display: none !important; }

    /* HOME WALL / BOX */
    #home-wall {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at top, #182032 0%, #0b0d12 70%);
      padding: 20px;
    }
    .wall-box {
      width: 100%; max-width: 880px; background: var(--panel);
      border: 1px solid var(--border); border-radius: 20px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.65);
      display: grid; grid-template-columns: 340px 1fr; overflow: hidden;
      min-height: 480px;
    }
    .auth-col {
      padding: 28px; background: var(--panel-2); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .brand { font-size: 22px; font-weight: 800; letter-spacing: 0.4px; display: flex; align-items: center; gap: 10px; }
    .brand span { color: var(--accent); }
    .tabs { display: flex; gap: 6px; background: var(--bg); padding: 4px; border-radius: 10px; margin: 16px 0; }
    .tab-btn { flex: 1; padding: 8px; background: transparent; color: var(--muted); font-size: 14px; }
    .tab-btn.active { background: var(--panel-2); color: var(--text); box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .field label { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .field input, .field select {
      background: var(--bg); border: 1px solid var(--border); color: var(--text);
      padding: 11px 12px; border-radius: 10px; outline: none;
    }
    .field input:focus { border-color: var(--accent); }
    .btn-primary { background: var(--accent); color: #111827; padding: 12px; width: 100%; font-size: 15px; }
    .btn-secondary { background: var(--panel); color: var(--text); border: 1px solid var(--border); padding: 10px 14px; font-size: 14px; }
    .status-msg { font-size: 13px; min-height: 18px; margin-top: 8px; color: var(--accent); }

    .lobby-col { padding: 28px; display: flex; flex-direction: column; gap: 16px; }
    .lobby-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .create-bar { display: flex; gap: 8px; }
    .room-list {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
      padding-right: 4px;
    }
    .room-card {
      background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 16px; display: flex; justify-content: space-between; align-items: center;
    }
    .room-meta { display: flex; flex-direction: column; gap: 4px; }
    .room-code { font-weight: 800; font-size: 16px; color: var(--accent); letter-spacing: 1px; }
    .room-players { font-size: 13px; color: var(--muted); }
    .badge { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: rgba(16,185,129,0.15); color: var(--ok); font-weight: 700; }
    .badge.full { background: rgba(239,68,68,0.15); color: var(--danger); }

    /* TABLETOP */
    #table-view { width: 100%; height: 100%; display: flex; flex-direction: column; }
    .hud-top {
      height: 52px; background: var(--panel); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; padding: 0 14px; gap: 10px;
    }
    .hud-group { display: flex; align-items: center; gap: 8px; }
    .pill { background: var(--bg); border: 1px solid var(--border); padding: 6px 10px; border-radius: 10px; font-size: 13px; display: flex; align-items: center; gap: 6px; }
    .life-btn { width: 26px; height: 26px; border-radius: 6px; background: var(--panel-2); color: var(--text); font-size: 16px; }
    .battlefield-wrap { flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; }
    .zone {
      flex: 1; position: relative; border-bottom: 1px dashed var(--border);
      background: radial-gradient(circle at center, #131824 0%, #0d1017 100%);
    }
    .zone.opp { background: radial-gradient(circle at center, #18131d 0%, #0d1017 100%); }
    .zone-label {
      position: absolute; top: 8px; left: 12px; font-size: 11px; text-transform: uppercase;
      letter-spacing: 1px; color: var(--muted); pointer-events: none; opacity: 0.7;
    }
    .card {
      position: absolute; width: 86px; height: 120px; border-radius: 8px;
      background: linear-gradient(145deg, #262f42, #171c28); border: 2px solid #475569;
      padding: 6px; display: flex; flex-direction: column; justify-content: space-between;
      box-shadow: 0 8px 18px rgba(0,0,0,0.55); touch-action: none;
      transition: transform 0.15s ease;
    }
    .card.tapped { transform: rotate(90deg); border-color: var(--accent); }
    .card-name { font-size: 11px; font-weight: 700; line-height: 1.15; overflow: hidden; }
    .card-type { font-size: 9px; color: var(--muted); }
    .card-pt { align-self: flex-end; background: var(--bg); padding: 2px 5px; border-radius: 4px; font-size: 10px; font-weight: 800; }
    .hand-bar {
      height: 136px; background: var(--panel); border-top: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px; padding: 8px 14px; overflow-x: auto;
    }
    .hand-card {
      min-width: 86px; height: 116px; border-radius: 8px; background: #1e2636;
      border: 1px solid #3b4761; padding: 6px; display: flex; flex-direction: column;
      justify-content: space-between; flex-shrink: 0;
    }
  </style>
</head>
<body>
  <!-- HOME WALL / BOX -->
  <div id="home-wall">
    <div class="wall-box">
      <div class="auth-col">
        <div>
          <div class="brand">✦ <span>AetherTable</span> MTG</div>
          <p style="font-size:13px; color:var(--muted); margin:6px 0 0;">iPad Tabletop & Multiplayer Wall</p>

          <!-- Signed-Out Form -->
          <div id="auth-forms">
            <div class="tabs">
              <button class="tab-btn active" id="tab-login" onclick="switchAuthMode('login')">Sign In</button>
              <button class="tab-btn" id="tab-signup" onclick="switchAuthMode('signup')">Create Account</button>
            </div>
            <div class="field hidden" id="name-field">
              <label>Planeswalker Name</label>
              <input type="text" id="auth-name" placeholder="e.g. Jace" />
            </div>
            <div class="field">
              <label>Email</label>
              <input type="email" id="auth-email" placeholder="you@example.com" />
            </div>
            <div class="field">
              <label>Password</label>
              <input type="password" id="auth-pass" placeholder="Min 6 characters" />
            </div>
            <button class="btn-primary" id="auth-submit" onclick="handleAuth()">Sign In</button>
            <div class="status-msg" id="auth-status"></div>
          </div>

          <!-- Signed-In Profile Box -->
          <div id="profile-box" class="hidden" style="margin-top:20px;">
            <div style="background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:14px;">
              <div style="font-size:12px; color:var(--muted);">SIGNED IN AS</div>
              <div id="profile-name" style="font-size:18px; font-weight:800; color:var(--accent); margin:4px 0;"></div>
              <div id="profile-email" style="font-size:12px; color:var(--muted);"></div>
            </div>
            <button class="btn-secondary" style="width:100%; margin-top:12px;" onclick="signOutUser()">Sign Out</button>
          </div>
        </div>

        <div style="font-size:11px; color:var(--muted); line-height:1.4;">
          Add to Home Screen in Safari for full-screen iPad play.
        </div>
      </div>

      <!-- LIVE TABLE WALL -->
      <div class="lobby-col">
        <div class="lobby-header">
          <div>
            <h3 style="margin:0; font-size:18px;">Live Table Wall</h3>
            <span style="font-size:12px; color:var(--muted);" id="lobby-sub">Sign in on the left to host or join a match</span>
          </div>
          <div class="create-bar">
            <input type="text" id="new-room-code" placeholder="ROOM CODE" maxlength="10" style="width:125px; background:var(--bg); border:1px solid var(--border); color:var(--text); padding:9px 10px; border-radius:10px; text-transform:uppercase;" />
            <button class="btn-primary" style="width:auto; padding:10px 16px;" onclick="createRoom()">+ Host Table</button>
          </div>
        </div>
        <div class="room-list" id="room-list"></div>
      </div>
    </div>
  </div>

  <!-- GAME TABLETOP -->
  <div id="table-view" class="hidden">
    <div class="hud-top">
      <div class="hud-group">
        <button class="btn-secondary" onclick="leaveRoom()">← Wall</button>
        <div class="pill">Room: <strong id="hud-room" style="color:var(--accent);"></strong></div>
        <button class="btn-secondary" onclick="untapAll()">Untap All</button>
        <button class="btn-secondary" onclick="drawCard()">Draw Card</button>
      </div>
      <div class="hud-group">
        <div class="pill">
          <span id="opp-label">Opponent</span>: <strong id="opp-life" style="color:var(--danger);">20</strong>
        </div>
        <div class="pill">
          <span>My Life</span>:
          <button class="life-btn" onclick="changeLife(-1)">-</button>
          <strong id="my-life" style="color:var(--ok); min-width:22px; text-align:center;">20</strong>
          <button class="life-btn" onclick="changeLife(1)">+</button>
        </div>
      </div>
    </div>

    <div class="battlefield-wrap">
      <div class="zone opp" id="opp-zone">
        <div class="zone-label" id="opp-zone-label">Opponent Battlefield</div>
      </div>
      <div class="zone" id="my-zone">
        <div class="zone-label">Your Battlefield (Drag cards here • Tap to Tap/Untap)</div>
      </div>
    </div>

    <div class="hand-bar" id="hand-bar"></div>
  </div>

  <script>
    // 1. PASTE YOUR SUPABASE CREDENTIALS HERE (Developer setup only)
    const SUPABASE_URL = "=https://fwpnbbkyhugzppclsgbl.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_QU5rvS7F-VfmocfgP1SqKw_gymqv9bQ";

    const sb = (SUPABASE_URL.startsWith("http"))
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : null;

    let authMode = "login";
    let currentUser = null;
    let currentRoom = null;
    let isHost = false;
    let roomSub = null;

    const STARTER_DECK = [
      { name: "Raging Goblin", type: "Creature — Goblin", pt: "1/1" },
      { name: "Serra Angel", type: "Creature — Angel", pt: "4/4" },
      { name: "Llanowar Elves", type: "Creature — Elf Druid", pt: "1/1" },
      { name: "Lightning Bolt", type: "Instant", pt: "3 DMG" },
      { name: "Counterspell", type: "Instant", pt: "Counter" },
      { name: "Craw Wurm", type: "Creature — Wurm", pt: "6/4" },
      { name: "Sol Ring", type: "Artifact", pt: "{2}" },
      { name: "Command Tower", type: "Land", pt: "Mana" },
      { name: "Mountain", type: "Basic Land", pt: "{R}" },
      { name: "Plains", type: "Basic Land", pt: "{W}" },
      { name: "Forest", type: "Basic Land", pt: "{G}" },
      { name: "Island", type: "Basic Land", pt: "{U}" }
    ];

    let localState = {
      hostLife: 20,
      guestLife: 20,
      hostBoard: [],
      guestBoard: [],
      hand: [],
      library: []
    };

    function setStatus(msg, isErr = false) {
      const el = document.getElementById("auth-status");
      el.style.color = isErr ? "var(--danger)" : "var(--ok)";
      el.textContent = msg;
    }

    function switchAuthMode(mode) {
      authMode = mode;
      document.getElementById("tab-login").classList.toggle("active", mode === "login");
      document.getElementById("tab-signup").classList.toggle("active", mode === "signup");
      document.getElementById("name-field").classList.toggle("hidden", mode === "login");
      document.getElementById("auth-submit").textContent = mode === "login" ? "Sign In" : "Create Account";
      setStatus("");
    }

    async function handleAuth() {
      if (!sb) {
        setStatus("Developer setup needed: paste SUPABASE_URL and SUPABASE_ANON_KEY in index.html.", true);
        return;
      }
      const email = document.getElementById("auth-email").value.trim();
      const password = document.getElementById("auth-pass").value;
      const displayName = document.getElementById("auth-name").value.trim() || email.split("@")[0];

      if (!email || password.length < 6) {
        setStatus("Enter a valid email and a password (6+ chars).", true);
        return;
      }

      setStatus("Connecting...");
      if (authMode === "signup") {
        const { data, error } = await sb.auth.signUp({
          email,
          password,
          options: { data: { display_name: displayName } }
        });
        if (error) return setStatus(error.message, true);
        setStatus("Account created! Signed in.");
        onSignedIn(data.user);
      } else {
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) return setStatus(error.message, true);
        setStatus("Signed in!");
        onSignedIn(data.user);
      }
    }

    function onSignedIn(user) {
      if (!user) return;
      currentUser = {
        id: user.id,
        email: user.email,
        name: user.user_metadata?.display_name || user.email.split("@")[0]
      };
      document.getElementById("auth-forms").classList.add("hidden");
      document.getElementById("profile-box").classList.remove("hidden");
      document.getElementById("profile-name").textContent = currentUser.name;
      document.getElementById("profile-email").textContent = currentUser.email;
      document.getElementById("lobby-sub").textContent = "Create a table or tap Join on an open seat";
      loadLobby();
    }

    async function signOutUser() {
      if (sb) await sb.auth.signOut();
      currentUser = null;
      document.getElementById("auth-forms").classList.remove("hidden");
      document.getElementById("profile-box").classList.add("hidden");
      document.getElementById("room-list").innerHTML = "";
    }

    async function loadLobby() {
      if (!sb || !currentUser) return;
      const { data } = await sb.from("rooms").select("*").order("updated_at", { ascending: false }).limit(30);
      renderLobby(data || []);

      sb.channel("lobby-wall")
        .on("postgres_changes", { event: "*", schema: "public", table: "rooms" }, async () => {
          const { data: fresh } = await sb.from("rooms").select("*").order("updated_at", { ascending: false }).limit(30);
          renderLobby(fresh || []);
        })
        .subscribe();
    }

    function renderLobby(rooms) {
      const list = document.getElementById("room-list");
      if (!rooms.length) {
        list.innerHTML = `<div style="color:var(--muted); font-size:14px; padding:20px; text-align:center;">No active tables yet. Tap <strong>+ Host Table</strong> to start one.</div>`;
        return;
      }
      list.innerHTML = rooms.map(r => {
        const isFull = Boolean(r.guest_id && r.guest_id !== currentUser.id && r.host_id !== currentUser.id);
        return `
          <div class="room-card">
            <div class="room-meta">
              <div style="display:flex; align-items:center; gap:8px;">
                <span class="room-code">${r.code}</span>
                <span class="badge ${isFull ? 'full' : ''}">${isFull ? '2/2 Full' : 'Open Seat'}</span>
              </div>
              <div class="room-players">Seat 1: <strong>${r.host_name}</strong> • Seat 2: <strong>${r.guest_name || 'Waiting...'}</strong></div>
            </div>
            <button class="btn-secondary" ${isFull ? 'disabled style="opacity:0.4"' : ''} onclick="joinRoom('${r.code}')">
              ${r.host_id === currentUser.id ? 'Rejoin Host' : 'Join Table'}
            </button>
          </div>
        `;
      }).join("");
    }

    function initDeck() {
      const deck = [...STARTER_DECK, ...STARTER_DECK].sort(() => Math.random() - 0.5);
      localState.library = deck.slice(7);
      localState.hand = deck.slice(0, 7).map((c, idx) => ({ ...c, uid: Date.now() + "-" + idx }));
    }

    async function createRoom() {
      if (!currentUser) return setStatus("Sign in first before hosting a table.", true);
      const raw = document.getElementById("new-room-code").value.trim().toUpperCase();
      const code = raw || Math.random().toString(36).substring(2, 7).toUpperCase();

      initDeck();
      const initialState = { hostLife: 20, guestLife: 20, hostBoard: [], guestBoard: [] };

      const { data, error } = await sb.from("rooms").upsert({
        code,
        host_id: currentUser.id,
        host_name: currentUser.name,
        guest_id: null,
        guest_name: null,
        state: initialState,
        updated_at: new Date().toISOString()
      }).select().single();

      if (error) return setStatus(error.message, true);
      enterTable(data, true);
    }

    async function joinRoom(code) {
      if (!currentUser) return setStatus("Sign in first.", true);
      const { data: room, error } = await sb.from("rooms").select("*").eq("code", code).single();
      if (error || !room) return setStatus("Room not found.", true);

      const hosting = room.host_id === currentUser.id;
      if (!hosting && !room.guest_id) {
        const { data: updated } = await sb.from("rooms").update({
          guest_id: currentUser.id,
          guest_name: currentUser.name,
          updated_at: new Date().toISOString()
        }).eq("code", code).select().single();
        initDeck();
        enterTable(updated || room, false);
      } else {
        if (!localState.hand.length) initDeck();
        enterTable(room, hosting);
      }
    }

    function enterTable(room, hosting) {
      currentRoom = room;
      isHost = hosting;
      localState.hostLife = room.state?.hostLife ?? 20;
      localState.guestLife = room.state?.guestLife ?? 20;
      localState.hostBoard = room.state?.hostBoard ?? [];
      localState.guestBoard = room.state?.guestBoard ?? [];

      document.getElementById("home-wall").classList.add("hidden");
      document.getElementById("table-view").classList.remove("hidden");
      document.getElementById("hud-room").textContent = room.code;

      if (roomSub) sb.removeChannel(roomSub);
      roomSub = sb.channel("room-" + room.code)
        .on("postgres_changes", { event: "UPDATE", schema: "public", table: "rooms", filter: `code=eq.${room.code}` }, payload => {
          currentRoom = payload.new;
          const st = payload.new.state || {};
          localState.hostLife = st.hostLife ?? 20;
          localState.guestLife = st.guestLife ?? 20;
          localState.hostBoard = st.hostBoard ?? [];
          localState.guestBoard = st.guestBoard ?? [];
          renderTable();
        })
        .subscribe();

      renderTable();
    }

    async function syncState() {
      if (!sb || !currentRoom) return;
      await sb.from("rooms").update({
        state: {
          hostLife: localState.hostLife,
          guestLife: localState.guestLife,
          hostBoard: localState.hostBoard,
          guestBoard: localState.guestBoard
        },
        updated_at: new Date().toISOString()
      }).eq("code", currentRoom.code);
    }

    function leaveRoom() {
      if (roomSub) sb.removeChannel(roomSub);
      currentRoom = null;
      document.getElementById("table-view").classList.add("hidden");
      document.getElementById("home-wall").classList.remove("hidden");
    }

    function changeLife(delta) {
      if (isHost) localState.hostLife += delta;
      else localState.guestLife += delta;
      renderTable();
      syncState();
    }

    function drawCard() {
      if (!localState.library.length) return;
      const next = localState.library.shift();
      localState.hand.push({ ...next, uid: Date.now() + "-" + Math.random() });
      renderHand();
    }

    function playFromHand(uid) {
      const idx = localState.hand.findIndex(c => c.uid === uid);
      if (idx === -1) return;
      const [card] = localState.hand.splice(idx, 1);
      const myBoard = isHost ? localState.hostBoard : localState.guestBoard;
      myBoard.push({
        ...card,
        x: 0.12 + (myBoard.length % 7) * 0.11,
        y: 0.25,
        tapped: false
      });
      renderTable();
      syncState();
    }

    function untapAll() {
      const myBoard = isHost ? localState.hostBoard : localState.guestBoard;
      myBoard.forEach(c => c.tapped = false);
      renderTable();
      syncState();
    }

    function renderTable() {
      const oppName = isHost ? (currentRoom.guest_name || "Waiting for Seat 2...") : currentRoom.host_name;
      document.getElementById("opp-label").textContent = oppName;
      document.getElementById("opp-zone-label").textContent = `${oppName}'s Battlefield`;
      document.getElementById("my-life").textContent = isHost ? localState.hostLife : localState.guestLife;
      document.getElementById("opp-life").textContent = isHost ? localState.guestLife : localState.hostLife;

      const myBoard = isHost ? localState.hostBoard : localState.guestBoard;
      const oppBoard = isHost ? localState.guestBoard : localState.hostBoard;

      renderZone("my-zone", myBoard, true);
      renderZone("opp-zone", oppBoard, false);
      renderHand();
    }

    function renderZone(zoneId, cards, interactive) {
      const zone = document.getElementById(zoneId);
      const label = zone.querySelector(".zone-label");
      zone.innerHTML = "";
      zone.appendChild(label);

      const rect = zone.getBoundingClientRect();
      cards.forEach(c => {
        const el = document.createElement("div");
        el.className = "card" + (c.tapped ? " tapped" : "");
        el.style.left = `${(c.x || 0.1) * (rect.width || 800)}px`;
        el.style.top = `${(c.y || 0.2) * (rect.height || 260)}px`;
        el.innerHTML = `
          <div>
            <div class="card-name">${c.name}</div>
            <div class="card-type">${c.type}</div>
          </div>
          <div class="card-pt">${c.pt}</div>
        `;

        if (interactive) {
          let moved = false, startX = 0, startY = 0, origLeft = 0, origTop = 0;
          el.onpointerdown = e => {
            moved = false;
            startX = e.clientX; startY = e.clientY;
            origLeft = el.offsetLeft; origTop = el.offsetTop;
            el.setPointerCapture(e.pointerId);
          };
          el.onpointermove = e => {
            if (!el.hasPointerCapture(e.pointerId)) return;
            const dx = e.clientX - startX, dy = e.clientY - startY;
            if (Math.abs(dx) > 6 || Math.abs(dy) > 6) moved = true;
            if (moved) {
              el.style.left = `${Math.max(0, Math.min(rect.width - 86, origLeft + dx))}px`;
              el.style.top = `${Math.max(0, Math.min(rect.height - 120, origTop + dy))}px`;
            }
          };
          el.onpointerup = e => {
            if (el.hasPointerCapture(e.pointerId)) el.releasePointerCapture(e.pointerId);
            if (!moved) {
              c.tapped = !c.tapped;
            } else {
              c.x = el.offsetLeft / (rect.width || 800);
              c.y = el.offsetTop / (rect.height || 260);
            }
            renderTable();
            syncState();
          };
        }
        zone.appendChild(el);
      });
    }

    function renderHand() {
      const bar = document.getElementById("hand-bar");
      bar.innerHTML = localState.hand.map(c => `
        <div class="hand-card" onclick="playFromHand('${c.uid}')">
          <div>
            <div class="card-name">${c.name}</div>
            <div class="card-type">${c.type}</div>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:10px; color:var(--accent);">Tap to Play</span>
            <span class="card-pt">${c.pt}</span>
          </div>
        </div>
      `).join("");
    }

    // Auto-restore session on reload
    (async () => {
      if (!sb) return;
      const { data } = await sb.auth.getSession();
      if (data?.session?.user) onSignedIn(data.session.user);
    })();
  </script>
</body>
</html>
